name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffprobe -version
        shell: bash
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
      - run: photo-grading doctor --json
        shell: bash
      - run: photo-grading skill --json > contract.json
        shell: bash
      - run: python -c "import json; d = json.load(open('contract.json')); assert d['skill_id'] == 'photo-grading'"
